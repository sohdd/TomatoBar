name: Build TomatoBar

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project TomatoBar.xcodeproj \
            -scheme TomatoBar \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Create ZIP archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/TomatoBar.app \
            TomatoBar.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TomatoBar-${{ github.ref_name }}-${{ github.run_number }}
          path: TomatoBar.zip
          if-no-files-found: error
          retention-days: 14
